<svg width="160px" height="160px" viewBox="0 0 160 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="clock-grad">
      <stop stop-color="#F5B942" offset="0%"/>
      <stop stop-color="#FFD278" offset="100%"/>
    </linearGradient>
    <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="paper-grad">
      <stop stop-color="#FCFCFF" offset="0%"/>
      <stop stop-color="#F3F3F7" offset="100%"/>
    </linearGradient>
    <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="stamp-grad">
      <stop stop-color="#6E6EE9" offset="0%"/>
      <stop stop-color="#5B5BEA" offset="100%"/>
    </linearGradient>
  </defs>
  <g stroke="none" strokeWidth="1" fill="none" fillRule="evenodd">
    <circle fill="#EAEEF9" cx="80" cy="80" r="72"/>
    <circle fill="#F0F2F6" cx="80" cy="80" r="58"/>
    <!-- Document -->
    <rect fill="url(#paper-grad)" x="40" y="30" width="60" height="80" rx="6"/>
    <rect fill="#E8E8EF" x="52" y="48" width="28" height="4" rx="2"/>
    <rect fill="#E8E8EF" x="52" y="58" width="36" height="4" rx="2"/>
    <rect fill="#E8E8EF" x="52" y="68" width="24" height="4" rx="2"/>
    <rect fill="#E8E8EF" x="52" y="78" width="32" height="4" rx="2"/>
    <!-- Clock -->
    <circle fill="url(#clock-grad)" cx="110" cy="105" r="28"/>
    <circle fill="#FFFFFF" cx="110" cy="105" r="22"/>
    <!-- Clock hands -->
    <line x1="110" y1="105" x2="110" y2="90" stroke="#5B5BEA" strokeWidth="2.5" strokeLinecap="round"/>
    <line x1="110" y1="105" x2="122" y2="105" stroke="#F5B942" strokeWidth="2" strokeLinecap="round"/>
    <circle fill="#5B5BEA" cx="110" cy="105" r="2.5"/>
    <!-- Clock ticks -->
    <line x1="110" y1="85" x2="110" y2="88" stroke="#DCDCE4" strokeWidth="1.5" strokeLinecap="round"/>
    <line x1="110" y1="122" x2="110" y2="125" stroke="#DCDCE4" strokeWidth="1.5" strokeLinecap="round"/>
    <line x1="90" y1="105" x2="93" y2="105" stroke="#DCDCE4" strokeWidth="1.5" strokeLinecap="round"/>
    <line x1="127" y1="105" x2="130" y2="105" stroke="#DCDCE4" strokeWidth="1.5" strokeLinecap="round"/>
    <!-- Decorative elements -->
    <circle fill="#DCDCE4" cx="25" cy="45" r="4"/>
    <circle fill="#DCDCE4" cx="140" cy="50" r="3"/>
    <circle fill="#EDEDF2" cx="20" cy="120" r="5"/>
    <circle fill="#EDEDF2" cx="145" cy="115" r="4"/>
    <!-- Dashed progress arc -->
    <path d="M40,130 Q80,145 120,130" stroke="#C9D4E2" strokeWidth="1" strokeDasharray="3.6" fill="none"/>
  </g>
</svg>
