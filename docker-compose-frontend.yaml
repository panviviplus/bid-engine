services:
  frontend:
    image: bid-engine-frontend:${FRONTEND_TAG:-latest}
    build:
      context: ./bid-engine-frontend
      dockerfile: Dockerfile
    container_name: bid-engine-frontend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_USR_SERVER=http://localhost:8081
      - NEXT_PUBLIC_SYSTEM_SERVER=http://localhost:8081
      - UPSTREAM_ORIGIN=http://host.docker.internal:8081
      - NEXT_TELEMETRY_DISABLED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
